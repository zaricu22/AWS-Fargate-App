server:
  port: 8080

spring:
  application:
    name: items-backend
  datasource:
    # AWS: sourced by Data-Stack and set by Backend-Stack in ECS+Fargate task definition.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  cognito:
    # AWS: sourced by Auth-Stack and set by Backend-Stack in ECS+Fargate task definition,
    # see config/SecurityConfig.java for how these are used to validate JWTs.
    issuer-uri: ${COGNITO_ISSUER_URI}
    app-client-id: ${COGNITO_APP_CLIENT_ID}

# AWS: /actuator/health probe endpoint for ECS health check (wired in Backend-Stack).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
